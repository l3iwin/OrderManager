spring.datasource.url=jdbc:postgresql://localhost:5432/order_manager_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

logging.file.name=logs/order-manager.log
logging.level.com.example.ordermanager=INFO